{% extends "admin/change_list.html" %}
{% load i18n admin_urls %}

{% block object-tools %}
<div style="display: flex; justify-content: flex-end; margin-bottom: 12px; gap: 10px; flex-wrap: wrap;">
    <a href="{% url 'admin:visitorlog-download-csv' %}" 
       class="btn btn-success" 
       style="background: #10b981; border-color: #10b981; color: #ffffff; font-weight: 600; padding: 8px 18px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(16,185,129,0.25);">
        <i class="fas fa-file-download"></i> 📥 Download CSV Report
    </a>
    <a href="{% url 'admin:visitorlog-preview-report' %}" 
       target="_blank"
       class="btn btn-secondary" 
       style="background: #062e5c; border-color: #062e5c; color: #ffffff; font-weight: 600; padding: 8px 18px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(6,46,92,0.25);">
        <i class="fas fa-eye"></i> 👁️ Preview Report in Browser
    </a>
    <a href="{% url 'admin:visitorlog-send-report' %}" 
       onclick="return confirm('Are you sure you want to compile and send the weekly visitor summary report to the Skilltech management email right now?');"
       class="btn btn-primary" 
       style="background: #cc0070; border-color: #cc0070; color: #ffffff; font-weight: 600; padding: 8px 18px; border-radius: 6px; text-decoration: none; display: inline-flex; align-items: center; gap: 8px; box-shadow: 0 2px 6px rgba(204,0,112,0.3);">
        <i class="fas fa-paper-plane"></i> Send Weekly Report to Email Now
    </a>
</div>
{{ block.super }}
{% endblock %}
